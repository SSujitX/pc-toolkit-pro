name: Release Windows

# Tag a release from VERSION:
#   1. echo 3.0.1 > VERSION && ./scripts/sync-version.sh
#   2. git commit -am "chore: bump version to 3.0.1"
#   3. git tag v3.0.1 && git push origin v3.0.1
#
# Or run manually from Actions → Release Windows → Run workflow.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create/use (e.g. v3.0.1). Leave empty to use VERSION file.'
        required: false
        default: ''

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_STRIP: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  release:
    name: Build + publish EXE
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Read VERSION
        id: ver
        shell: bash
        run: |
          VERSION="$(node ./scripts/sync-version.mjs print)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            EXPECTED="v${VERSION}"
            if [[ "$TAG" != "$EXPECTED" ]]; then
              echo "Tag $TAG does not match VERSION file ($EXPECTED)" >&2
              exit 1
            fi
          fi
          echo "Using product version $VERSION"

      - name: Check version sync
        run: node ./scripts/sync-version.mjs check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-tauri-release-v2
          cache-workspace-crates: "true"
          cache-on-failure: "true"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Secret TAURI_SIGNING_PRIVATE_KEY is empty"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty"
          }
          $key = $env:TAURI_SIGNING_PRIVATE_KEY.Trim().Replace("`r", "")
          $path = Join-Path $env:RUNNER_TEMP "pctoolkit.key"
          # UTF-8 no BOM — Out-File -Encoding utf8 adds a BOM and breaks GITHUB_ENV.
          [System.IO.File]::WriteAllText($path, $key)
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY_PATH=$path" -Encoding utf8NoBOM
          Write-Host "signing_key_chars=$($key.Length) password_chars=$($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD.Length) path=$path"

      - name: Build Tauri app (NSIS)
        shell: pwsh
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PATH -or -not (Test-Path $env:TAURI_SIGNING_PRIVATE_KEY_PATH)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PATH missing or not a file (prepare step failed?)"
          }
          $env:TAURI_SIGNING_PRIVATE_KEY = [System.IO.File]::ReadAllText($env:TAURI_SIGNING_PRIVATE_KEY_PATH).Trim()
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Private key file is empty"
          }
          Write-Host "build_signing_key_chars=$($env:TAURI_SIGNING_PRIVATE_KEY.Length)"
          pnpm tauri build --bundles nsis

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Collect artifacts
        id: artifacts
        shell: pwsh
        run: |
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            Where-Object { $_.Name -notlike '*.sig' } |
            Select-Object -First 1
          $portableCandidates = @(
            "src-tauri/target/release/PCToolkitPro.exe",
            "src-tauri/target/release/pc-toolkit-pro.exe"
          )
          $portable = $portableCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found" }
          if (-not $portable) { throw "Portable exe not found (expected PCToolkitPro.exe)" }

          $version = "${{ steps.ver.outputs.version }}"
          # Match GitHub release title: "PC Toolkit Pro vX.Y.Z"
          $setupName = "PC Toolkit Pro v$version Setup.exe"
          $portableName = "PC Toolkit Pro v$version.exe"
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          Copy-Item $nsis.FullName "release-out/$setupName"
          Copy-Item $portable "release-out/$portableName"

          $sig = Get-ChildItem "$($nsis.DirectoryName)/*.sig" |
            Where-Object { $_.BaseName -eq $nsis.Name -or $_.Name -like "$($nsis.BaseName)*.sig" } |
            Select-Object -First 1
          if (-not $sig) {
            $sig = Get-ChildItem src-tauri/target/release/bundle/nsis/*.sig | Select-Object -First 1
          }
          if (-not $sig) {
            Write-Warning "Updater signature (.sig) not found. Set TAURI_SIGNING_PRIVATE_KEY secrets to publish auto-updates."
          } else {
            Copy-Item $sig.FullName "release-out/$setupName.sig"
            $env:RELEASE_TAG = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$version" }
            node ./scripts/build-updater-latest.mjs `
              --version $version `
              --notes "PC Toolkit Pro v$version" `
              --setup "release-out/$setupName" `
              --signature "release-out/$setupName.sig" `
              --out release-out/latest.json
          }

          Get-ChildItem release-out | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pc-toolkit-pro-${{ steps.ver.outputs.version }}-windows
          path: release-out/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: PC Toolkit Pro v${{ steps.ver.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: release-out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
