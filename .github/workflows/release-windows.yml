name: Release
run-name: "Release (${{ github.event.inputs.bump || github.ref_name }}) — ${{ github.ref_name }}"

# Operator flow (every release):
#   Actions → Release → Run workflow → bump = current | patch | minor | major
#
# Starts from root VERSION (X.Y.Z). No free-typed semver.
# The job:
#   1. Computes next X.Y.Z from VERSION + bump
#   2. Writes VERSION and syncs package / Cargo / app version files
#   3. Commits those files onto the branch so later commits keep that version
#   4. Creates annotated tag vX.Y.Z
#   5. Builds Windows NSIS setup + portable EXE
#   6. Publishes GitHub Release with categorized commit notes + assets
#      Setup:  PC Toolkit Pro vX.Y.Z Setup.exe
#      Portable: PC Toolkit Pro vX.Y.Z.exe
#      Updater: latest.json (+ .sig)
#
# Local tag push (vX.Y.Z, VERSION already matching) still publishes.
# Tags pushed by github-actions[bot] do not start a second build.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump from root VERSION. Use current to ship the file as-is.
        required: true
        type: choice
        options:
          - current
          - patch
          - minor
          - major
        default: patch
      prerelease:
        description: Mark GitHub Release as prerelease
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_STRIP: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  prepare:
    name: Bump VERSION + notes
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
      previous_tag: ${{ steps.ver.outputs.previous_tag }}
      bump: ${{ steps.ver.outputs.bump }}
      current: ${{ steps.ver.outputs.current }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Script tests
        run: node --test scripts/sync-version.test.mjs scripts/generate-release-notes.test.mjs

      - name: Resolve bump from VERSION
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be X.Y.Z (got '$CURRENT')" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BUMP="${INPUT_BUMP}"
            node ./scripts/sync-version.mjs bump "$BUMP"
            VER="$(tr -d '[:space:]' < VERSION)"
          else
            BUMP="current"
            VER="$CURRENT"
            if [[ "$REF_NAME" != "v${VER}" ]]; then
              echo "Tag $REF_NAME does not match VERSION file (v${VER})" >&2
              exit 1
            fi
          fi

          TAG="v${VER}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] && git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} already exists" >&2
            exit 1
          fi

          PREV_TAG="$(git describe --tags --abbrev=0 --exclude "${TAG}" 2>/dev/null || true)"
          {
            echo "current=${CURRENT}"
            echo "version=${VER}"
            echo "tag=${TAG}"
            echo "bump=${BUMP}"
            echo "previous_tag=${PREV_TAG}"
          } >>"$GITHUB_OUTPUT"
          echo "bump ${BUMP}: ${CURRENT} -> ${VER} (tag ${TAG}; previous=${PREV_TAG:-none})"

      - name: Commit VERSION onto branch
        if: github.event_name == 'workflow_dispatch'
        env:
          VER: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          BUMP: ${{ steps.ver.outputs.bump }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json pnpm-lock.yaml \
            src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock \
            src-tauri/crates/pctoolkit-core/Cargo.toml \
            src-tauri/crates/pctoolkit-platform/Cargo.toml \
            src/lib/models/application-shell.ts
          if git diff --cached --quiet; then
            echo "VERSION already at ${VER}; no package commit needed"
          else
            git commit -m "chore(release): ${BUMP} VERSION to ${VER}"
          fi
          git push origin "HEAD:${BRANCH}"
          git tag -a "${TAG}" -m "PC Toolkit Pro ${TAG}"
          git push origin "${TAG}"

      - name: Export release SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Build categorized release notes
        run: |
          set -euo pipefail
          node ./scripts/generate-release-notes.mjs \
            --previous-tag "${{ steps.ver.outputs.previous_tag }}" \
            --tag "${{ steps.ver.outputs.tag }}" \
            --bump "${{ steps.ver.outputs.bump }}" \
            --from-version "${{ steps.ver.outputs.current }}" \
            --version "${{ steps.ver.outputs.version }}" \
            >"${RUNNER_TEMP}/release-notes.md"
          echo "---- release notes preview ----"
          head -n 80 "${RUNNER_TEMP}/release-notes.md"

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build + publish EXE
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check version sync
        run: node ./scripts/sync-version.mjs check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-tauri-release-v2
          cache-workspace-crates: "true"
          cache-on-failure: "true"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Secret TAURI_SIGNING_PRIVATE_KEY is empty"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty"
          }
          $key = $env:TAURI_SIGNING_PRIVATE_KEY.Trim().Replace("`r", "")
          $path = Join-Path $env:RUNNER_TEMP "pctoolkit.key"
          [System.IO.File]::WriteAllText($path, $key)
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY_PATH=$path" -Encoding utf8NoBOM
          Write-Host "signing_key_chars=$($key.Length) password_chars=$($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD.Length) path=$path"

      - name: Build Tauri app (NSIS)
        shell: pwsh
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PATH -or -not (Test-Path $env:TAURI_SIGNING_PRIVATE_KEY_PATH)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PATH missing or not a file (prepare step failed?)"
          }
          $env:TAURI_SIGNING_PRIVATE_KEY = [System.IO.File]::ReadAllText($env:TAURI_SIGNING_PRIVATE_KEY_PATH).Trim()
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Private key file is empty"
          }
          Write-Host "build_signing_key_chars=$($env:TAURI_SIGNING_PRIVATE_KEY.Length)"
          pnpm tauri build --bundles nsis

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Collect artifacts
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            Where-Object { $_.Name -notlike '*.sig' } |
            Select-Object -First 1
          $portableCandidates = @(
            "src-tauri/target/release/PCToolkitPro.exe",
            "src-tauri/target/release/pc-toolkit-pro.exe"
          )
          $portable = $portableCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found" }
          if (-not $portable) { throw "Portable exe not found (expected PCToolkitPro.exe)" }

          $version = $env:VERSION
          $setupName = "PC Toolkit Pro v$version Setup.exe"
          $portableName = "PC Toolkit Pro v$version.exe"
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          Copy-Item $nsis.FullName "release-out/$setupName"
          Copy-Item $portable "release-out/$portableName"

          $sig = Get-ChildItem "$($nsis.DirectoryName)/*.sig" |
            Where-Object { $_.BaseName -eq $nsis.Name -or $_.Name -like "$($nsis.BaseName)*.sig" } |
            Select-Object -First 1
          if (-not $sig) {
            $sig = Get-ChildItem src-tauri/target/release/bundle/nsis/*.sig | Select-Object -First 1
          }
          if (-not $sig) {
            throw "Updater signature (.sig) not found. Set TAURI_SIGNING_PRIVATE_KEY secrets."
          }
          Copy-Item $sig.FullName "release-out/$setupName.sig"
          node ./scripts/build-updater-latest.mjs `
            --version $version `
            --notes "PC Toolkit Pro v$version" `
            --setup "release-out/$setupName" `
            --signature "release-out/$setupName.sig" `
            --out release-out/latest.json

          $sums = Join-Path "release-out" "SHA256SUMS"
          $lines = @()
          foreach ($file in @($setupName, $portableName, "latest.json")) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path "release-out" $file)).Hash.ToLower()
            $lines += "$hash  $file"
          }
          [System.IO.File]::WriteAllLines($sums, $lines)
          Get-ChildItem release-out | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pc-toolkit-pro-${{ needs.prepare.outputs.version }}-windows
          path: release-out/*
          if-no-files-found: error
          retention-days: 30

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes

      - name: Publish GitHub Release + assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: PC Toolkit Pro v${{ needs.prepare.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          draft: false
          body_path: release-notes/release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release-out/PC Toolkit Pro v${{ needs.prepare.outputs.version }} Setup.exe
            release-out/PC Toolkit Pro v${{ needs.prepare.outputs.version }} Setup.exe.sig
            release-out/PC Toolkit Pro v${{ needs.prepare.outputs.version }}.exe
            release-out/latest.json
            release-out/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
