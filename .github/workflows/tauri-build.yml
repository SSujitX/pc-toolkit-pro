name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - feat/tauri-rewrite
      - master
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - 'VERSION'
      - 'scripts/sync-version.sh'
      - '.github/workflows/tauri-build.yml'
  pull_request:
    branches:
      - feat/tauri-rewrite
      - master

concurrency:
  group: tauri-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Faster CI release compile (still ships a usable EXE; skip fat LTO).
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
  CARGO_PROFILE_RELEASE_STRIP: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # Version comes from package.json "packageManager" (do not set version here).
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-tauri-v2
          cache-workspace-crates: "true"
          cache-on-failure: "true"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check VERSION sync
        run: node ./scripts/sync-version.mjs check

      - name: Prepare updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Secret TAURI_SIGNING_PRIVATE_KEY is empty"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty"
          }
          $key = $env:TAURI_SIGNING_PRIVATE_KEY.Trim().Replace("`r", "")
          $path = Join-Path $env:RUNNER_TEMP "pctoolkit.key"
          # UTF-8 no BOM — Out-File -Encoding utf8 adds a BOM and breaks GITHUB_ENV.
          [System.IO.File]::WriteAllText($path, $key)
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY_PATH=$path" -Encoding utf8NoBOM
          Write-Host "signing_key_chars=$($key.Length) password_chars=$($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD.Length) path=$path"

      - name: Build Tauri app (NSIS only)
        # Skip MSI/WiX — NSIS .exe is enough for CI artifacts and much faster to package.
        # Load key from the prepared file in this step so signing always sees a private key
        # (GITHUB_ENV alone has failed when BOM / PATH handling dropped the var).
        shell: pwsh
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PATH -or -not (Test-Path $env:TAURI_SIGNING_PRIVATE_KEY_PATH)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PATH missing or not a file (prepare step failed?)"
          }
          $env:TAURI_SIGNING_PRIVATE_KEY = [System.IO.File]::ReadAllText($env:TAURI_SIGNING_PRIVATE_KEY_PATH).Trim()
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Private key file is empty"
          }
          Write-Host "build_signing_key_chars=$($env:TAURI_SIGNING_PRIVATE_KEY.Length)"
          pnpm tauri build --bundles nsis

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: List bundle outputs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle -ErrorAction SilentlyContinue |
            Select-Object FullName, Length |
            Format-Table -AutoSize
          if (Test-Path src-tauri/target/release/pc-toolkit-pro.exe) {
            Get-Item src-tauri/target/release/pc-toolkit-pro.exe |
              Select-Object FullName, Length
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: pc-toolkit-pro-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/pc-toolkit-pro.exe
          if-no-files-found: error
          retention-days: 14
