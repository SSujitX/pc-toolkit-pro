[package]
name = "pctoolkit-core"
version = "3.0.1"
edition = "2021"

[dependencies]
pctoolkit-platform = { path = "../pctoolkit-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
