# Opera and Opera GX keep the profile in Roaming and the HTTP cache in Local.
[[rule]]
id = "browser.operaCache"
group = "browser"
name_key = "deepCleaner.rules.operaCache"
detail_key = "deepCleaner.rules.operaCacheDetail"
risk = "safe"
recommended = true
processes = ["opera.exe", "opera_gx.exe"]
roots = [
  { base = "roaming", path = "Opera Software", children = { names = ["Opera Stable", "Opera GX Stable"] }, suffixes = [
    "ShaderCache", "GrShaderCache", "GraphiteDawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GPUPersistentCache", "component_crx_cache", "extensions_crx_cache", "Cache", "Code Cache", "GPUCache",
    "DawnCache", "Media Cache", "Shared Dictionary/cache",
  ] },
  { base = "local", path = "Opera Software", children = { names = ["Opera Stable", "Opera GX Stable"] }, suffixes = [
    "ShaderCache", "GrShaderCache", "GraphiteDawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GPUPersistentCache", "component_crx_cache", "extensions_crx_cache", "Cache", "Code Cache", "GPUCache",
    "DawnCache", "Media Cache", "Shared Dictionary/cache",
  ] },
]

# Arc is an MSIX package; its Chromium User Data lives in the package LocalCache.
[[rule]]
id = "browser.arcCache"
group = "browser"
name_key = "deepCleaner.rules.arcCache"
detail_key = "deepCleaner.rules.arcCacheDetail"
risk = "safe"
recommended = true
processes = ["Arc.exe"]
roots = [
  { base = "local", path = "Packages/TheBrowserCompany.Arc_*/LocalCache/Local/Arc/User Data", suffixes = [
    "ShaderCache", "GrShaderCache", "GraphiteDawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GPUPersistentCache", "component_crx_cache", "extensions_crx_cache",
  ] },
  { base = "local", path = "Packages/TheBrowserCompany.Arc_*/LocalCache/Local/Arc/User Data", children = { names = ["Default", "Guest Profile", "System Profile"], prefixes = ["Profile "] }, suffixes = [
    "Cache", "Code Cache", "GPUCache", "ShaderCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GrShaderCache", "GraphiteDawnCache", "Media Cache", "Shared Dictionary/cache",
  ] },
]

