# Gecko family: the Local profile copy holds only caches (cache2, startupCache,
# shader-cache); bookmarks, logins, and mail live in the Roaming profile.
[[rule]]
id = "browser.firefoxCache"
group = "browser"
name_key = "deepCleaner.rules.firefoxCache"
detail_key = "deepCleaner.rules.firefoxCacheDetail"
risk = "safe"
recommended = false
processes = ["firefox.exe"]
roots = [
  { base = "local", path = "Mozilla/Firefox/Profiles", children = { all = true }, suffixes = [
    "cache2", "startupCache", "shader-cache",
  ] },
]

