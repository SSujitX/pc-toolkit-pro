# Deep Cleanup — browser rules. Schema: see README.md in this folder.
# Cache folders only. Cookies, passwords, history, sessions, Local Storage, IndexedDB,
# and extensions are never roots. Chromium leaves: browser-wide GPU/shader/component
# caches under User Data, plus HTTP/code/GPU/Dawn/media/shared-dictionary caches per
# profile (Default, Guest Profile, System Profile, Profile N).

[[rule]]
id = "browser.chromeCache"
group = "browser"
name_key = "deepCleaner.rules.chromeCache"
detail_key = "deepCleaner.rules.chromeCacheDetail"
risk = "safe"
recommended = true
processes = ["chrome.exe"]
roots = [
  { base = "local", path = "Google/Chrome/User Data", suffixes = [
    "ShaderCache", "GrShaderCache", "GraphiteDawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GPUPersistentCache", "component_crx_cache", "extensions_crx_cache",
  ] },
  { base = "local", path = "Google/Chrome/User Data", children = { names = ["Default", "Guest Profile", "System Profile"], prefixes = ["Profile "] }, suffixes = [
    "Cache", "Code Cache", "GPUCache", "ShaderCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GrShaderCache", "GraphiteDawnCache", "Media Cache", "Shared Dictionary/cache",
  ] },
  { base = "local", path = "Google/Chrome Beta/User Data", suffixes = [
    "ShaderCache", "GrShaderCache", "GraphiteDawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GPUPersistentCache", "component_crx_cache", "extensions_crx_cache",
  ] },
  { base = "local", path = "Google/Chrome Beta/User Data", children = { names = ["Default", "Guest Profile", "System Profile"], prefixes = ["Profile "] }, suffixes = [
    "Cache", "Code Cache", "GPUCache", "ShaderCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GrShaderCache", "GraphiteDawnCache", "Media Cache", "Shared Dictionary/cache",
  ] },
  { base = "local", path = "Google/Chrome Dev/User Data", suffixes = [
    "ShaderCache", "GrShaderCache", "GraphiteDawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GPUPersistentCache", "component_crx_cache", "extensions_crx_cache",
  ] },
  { base = "local", path = "Google/Chrome Dev/User Data", children = { names = ["Default", "Guest Profile", "System Profile"], prefixes = ["Profile "] }, suffixes = [
    "Cache", "Code Cache", "GPUCache", "ShaderCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GrShaderCache", "GraphiteDawnCache", "Media Cache", "Shared Dictionary/cache",
  ] },
  { base = "local", path = "Google/Chrome SxS/User Data", suffixes = [
    "ShaderCache", "GrShaderCache", "GraphiteDawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GPUPersistentCache", "component_crx_cache", "extensions_crx_cache",
  ] },
  { base = "local", path = "Google/Chrome SxS/User Data", children = { names = ["Default", "Guest Profile", "System Profile"], prefixes = ["Profile "] }, suffixes = [
    "Cache", "Code Cache", "GPUCache", "ShaderCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GrShaderCache", "GraphiteDawnCache", "Media Cache", "Shared Dictionary/cache",
  ] },
]

