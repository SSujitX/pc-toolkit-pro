# No close list: claude.exe is also the Claude Code CLI image name, and closing it
# would end terminal sessions. Locked files are reported as busy instead.
[[rule]]
id = "app.claudeCache"
group = "application"
name_key = "deepCleaner.rules.claudeCache"
detail_key = "deepCleaner.rules.claudeCacheDetail"
risk = "safe"
recommended = false
roots = [
  { base = "roaming", path = "Claude", suffixes = [
    "Cache", "Code Cache", "GPUCache", "ShaderCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GrShaderCache", "GraphiteDawnCache", "Shared Dictionary/cache", "logs", "Crashpad/reports",
  ] },
  { base = "local", path = "Packages/Claude_*/LocalCache/Roaming/Claude", suffixes = [
    "Cache", "Code Cache", "GPUCache", "ShaderCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GrShaderCache", "GraphiteDawnCache", "Shared Dictionary/cache", "logs", "Crashpad/reports",
  ] },
  { base = "local", path = "Packages/Claude_*/LocalCache/Local/Claude", suffixes = [
    "logs",
  ] },
]

# Codex desktop embeds a Chromium user-data folder under Roaming/Codex/web.
# No close list: codex.exe is also the Codex CLI image name.
[[rule]]
id = "app.codexCache"
group = "application"
name_key = "deepCleaner.rules.codexCache"
detail_key = "deepCleaner.rules.codexCacheDetail"
risk = "safe"
recommended = false
roots = [
  { base = "roaming", path = "Codex/web/Codex", suffixes = [
    "ShaderCache", "GrShaderCache", "GraphiteDawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GPUPersistentCache", "component_crx_cache", "extensions_crx_cache",
  ] },
  { base = "roaming", path = "Codex/web/Codex", children = { names = ["Default", "Guest Profile", "System Profile"], prefixes = ["Profile "] }, suffixes = [
    "Cache", "Code Cache", "GPUCache", "ShaderCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GrShaderCache", "GraphiteDawnCache", "Media Cache", "Shared Dictionary/cache",
  ] },
  { base = "local", path = "Codex/Logs" },
]

[[rule]]
id = "app.battleNetCache"
group = "application"
name_key = "deepCleaner.rules.battleNetCache"
detail_key = "deepCleaner.rules.battleNetCacheDetail"
risk = "safe"
recommended = true
processes = ["Battle.net.exe"]
roots = [
  { base = "local", path = "Battle.net/Cache" },
  { base = "local", path = "Battle.net/BrowserCaches", children = { all = true }, suffixes = [
    "Cache", "Code Cache", "GPUCache", "ShaderCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GrShaderCache", "GraphiteDawnCache", "Shared Dictionary/cache",
  ] },
]

# Only Chromium cache leaves inside the EA app CEF folder; its login state is kept.
[[rule]]
id = "app.eaDesktopCache"
group = "application"
name_key = "deepCleaner.rules.eaDesktopCache"
detail_key = "deepCleaner.rules.eaDesktopCacheDetail"
risk = "safe"
recommended = true
processes = ["EADesktop.exe"]
roots = [
  { base = "local", path = "Electronic Arts/EA Desktop/CEF", suffixes = [
    "BrowserCache/Cache", "BrowserCache/Code Cache", "BrowserCache/GPUCache", "BrowserCache/ShaderCache",
    "BrowserCache/DawnCache", "BrowserCache/DawnGraphiteCache", "BrowserCache/DawnWebGPUCache",
    "BrowserCache/GrShaderCache", "BrowserCache/GraphiteDawnCache", "BrowserCache/Shared Dictionary/cache",
    "Cache", "Code Cache", "GPUCache", "ShaderCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GrShaderCache", "GraphiteDawnCache", "Shared Dictionary/cache",
  ] },
]

# Chromium leaves inside webcache_* only: their Cookies / Local Storage keep the sign-in.
[[rule]]
id = "app.epicLauncherCache"
group = "application"
name_key = "deepCleaner.rules.epicLauncherCache"
detail_key = "deepCleaner.rules.epicLauncherCacheDetail"
risk = "safe"
recommended = true
processes = ["EpicGamesLauncher.exe", "EpicWebHelper.exe"]
roots = [
  { base = "local", path = "EpicGamesLauncher/Saved", children = { prefixes = ["webcache"] }, suffixes = [
    "Cache", "Code Cache", "GPUCache", "ShaderCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache",
    "GrShaderCache", "GraphiteDawnCache", "Shared Dictionary/cache",
  ] },
  { base = "local", path = "EpicGamesLauncher/Saved/Logs" },
  { base = "local", path = "EpicGamesLauncher/Saved/Crashes" },
]

# Conformed audio / peak / index files; Premiere, After Effects, and Media Encoder
# rebuild them on next import, which can take a while for large projects.
[[rule]]
id = "app.adobeMediaCache"
group = "application"
name_key = "deepCleaner.rules.adobeMediaCache"
detail_key = "deepCleaner.rules.adobeMediaCacheDetail"
risk = "recoverable"
recommended = false
processes = ["Adobe Premiere Pro.exe", "AfterFX.exe", "Adobe Media Encoder.exe", "Adobe Audition.exe"]
roots = [
  { base = "roaming", path = "Adobe/Common", suffixes = [
    "Media Cache Files", "Media Cache",
  ] },
  { base = "local", path = "Adobe/Common", suffixes = [
    "Media Cache Files", "Media Cache",
  ] },
]

[[rule]]
id = "app.zoomLogs"
group = "application"
name_key = "deepCleaner.rules.zoomLogs"
detail_key = "deepCleaner.rules.zoomLogsDetail"
risk = "safe"
recommended = true
matcher = { older_than_days = 14 }
roots = [
  { base = "roaming", path = "Zoom/logs" },
]

[[rule]]
id = "app.obsLogs"
group = "application"
name_key = "deepCleaner.rules.obsLogs"
detail_key = "deepCleaner.rules.obsLogsDetail"
risk = "safe"
recommended = true
matcher = { older_than_days = 14 }
roots = [
  { base = "roaming", path = "obs-studio", suffixes = [
    "logs", "crashes",
  ] },
]

# Downloaded album art and crash dumps. Playlists, media library, and vlcrc are kept.
[[rule]]
id = "app.vlcCache"
group = "application"
name_key = "deepCleaner.rules.vlcCache"
detail_key = "deepCleaner.rules.vlcCacheDetail"
risk = "safe"
recommended = true
processes = ["vlc.exe"]
roots = [
  { base = "roaming", path = "vlc", suffixes = [
    "art", "crashdump",
  ] },
]

# electron-updater download folders (%LOCALAPPDATA%\<app>-updater): only the
# pending update payload and the cached installer / blockmap. The app downloads
# them again on its next update check.
[[rule]]
id = "app.electronUpdaterCache"
group = "application"
name_key = "deepCleaner.rules.electronUpdaterCache"
detail_key = "deepCleaner.rules.electronUpdaterCacheDetail"
risk = "recoverable"
recommended = false
matcher = { any_of = [{ path_segments = ["pending"] }, { name_glob = ["installer.exe", "*.blockmap"] }], max_depth = 1 }
roots = [
  { base = "local", children = { contains = ["-updater"] } },
]
