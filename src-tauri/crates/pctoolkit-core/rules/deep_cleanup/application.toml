# Deep Cleanup — application rules. Schema: see README.md in this folder.
# Only rebuildable caches (HTTP/GPU/code/WebView caches, temp, logs, crash reports).
# Never account, message, Local Storage, IndexedDB, or settings folders.

[[rule]]
id = "app.whatsappCache"
group = "application"
name_key = "deepCleaner.rules.whatsappCache"
detail_key = "deepCleaner.rules.whatsappCacheDetail"
risk = "safe"
recommended = true
processes = ["WhatsApp.exe", "WhatsApp.Desktop.exe", "WhatsApp.Root.exe"]
roots = [
  { base = "local", path = "Packages", children = { contains = ["whatsapp"] }, suffixes = [
    "LocalCache/EBWebView/ShaderCache", "LocalCache/EBWebView/GrShaderCache",
    "LocalCache/EBWebView/GraphiteDawnCache", "LocalCache/EBWebView/DawnGraphiteCache",
    "LocalCache/EBWebView/DawnWebGPUCache", "LocalCache/EBWebView/GPUPersistentCache",
    "LocalCache/EBWebView/component_crx_cache", "LocalCache/EBWebView/extensions_crx_cache",
    "LocalCache/EBWebView/Default/Cache", "LocalCache/EBWebView/Default/Code Cache",
    "LocalCache/EBWebView/Default/GPUCache", "LocalCache/EBWebView/Default/ShaderCache",
    "LocalCache/EBWebView/Default/DawnCache", "LocalCache/EBWebView/Default/DawnGraphiteCache",
    "LocalCache/EBWebView/Default/DawnWebGPUCache", "LocalCache/EBWebView/Default/GrShaderCache",
    "LocalCache/EBWebView/Default/GraphiteDawnCache", "LocalCache/EBWebView/Default/Media Cache",
    "LocalCache/EBWebView/Default/Shared Dictionary/cache", "LocalCache/EBWebView/Profile */Cache",
    "LocalCache/EBWebView/Profile */Code Cache", "LocalCache/EBWebView/Profile */GPUCache",
    "LocalCache/EBWebView/Profile */ShaderCache", "LocalCache/EBWebView/Profile */DawnCache",
    "LocalCache/EBWebView/Profile */DawnGraphiteCache", "LocalCache/EBWebView/Profile */DawnWebGPUCache",
    "LocalCache/EBWebView/Profile */GrShaderCache", "LocalCache/EBWebView/Profile */GraphiteDawnCache",
    "LocalCache/EBWebView/Profile */Media Cache", "LocalCache/EBWebView/Profile */Shared Dictionary/cache",
    "TempState",
  ] },
]

